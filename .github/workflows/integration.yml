name: Integration Test

# Why this workflow exists:
# - test.yml uses `./` (local dist/) to validate code changes during PR
# - This workflow uses `@v1` (published release) to validate the release itself
# - Ensures the v1 tag points to correct commit with working dist/ files
# - Run manually after creating/updating releases to verify real-world usage

on:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.pm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm, yarn, bun]
        include:
          - pm: npm
            lockfile: package-lock.json
            install: npm ci
          - pm: pnpm
            lockfile: pnpm-lock.yaml
            install: pnpm install --frozen-lockfile
          - pm: yarn
            lockfile: yarn.lock
            install: yarn install --immutable
          - pm: bun
            lockfile: bun.lock
            install: bun install --frozen-lockfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: matrix.pm == 'pnpm'
        with:
          version: latest

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: matrix.pm == 'bun'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: matrix.pm != 'bun'
        with:
          node-version: 24

      - name: Setup test project
        run: |
          rm -f pnpm-lock.yaml package-lock.json yarn.lock bun.lock bun.lockb
          cp fixtures/package.json .
          cp fixtures/${{ matrix.lockfile }} .

      - uses: maou-shonen/node-cache-action@v1
        id: cache

      - name: Output cache status
        run: |
          echo "package-manager: ${{ steps.cache.outputs.package-manager }}"
          echo "lockfile: ${{ steps.cache.outputs.lockfile }}"
          echo "cache-hit: ${{ steps.cache.outputs.cache-hit }}"
          echo "cache-key: ${{ steps.cache.outputs.cache-key }}"

      - run: ${{ matrix.install }}
      - run: test -f node_modules/ms/package.json
