name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@v4
        with:
          install_args: bun
          cache: true

      - run: bun install --frozen-lockfile
      - run: bun run check

      - name: Verify dist/ is up to date
        run: git diff --exit-code dist/
